name: Release Windows x64

# Triggered when a GitHub Release is created or edited (draft/prerelease included).
# Builds xmrig.exe for Windows x64 and attaches the artifact to that release.
on:
  release:
    types: [created, edited]

permissions:
  contents: write   # required to upload assets to the release

jobs:
  build-release-windows:
    name: Build & attach xmrig.exe (Windows x64)
    runs-on: windows-2022

    env:
      # Dependency versions bundled with the official XMRig Windows builds
      UV_VERSION: 1.51.0
      OPENSSL_VERSION: 3.5.2
      HWLOC_VERSION: 2.15.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # Put cl.exe / nmake (and the Windows SDK) on PATH so OpenSSL's
      # Configure + nmake build can run outside a Developer shell.
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache deps build
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: deps
          # Single cache for all of deps/ (libuv + OpenSSL + hwloc). Bump the trailing
          # suffix when a dependency version or its build recipe changes.
          key: deps-${{ env.UV_VERSION }}-ossl${{ env.OPENSSL_VERSION }}-hwloc${{ env.HWLOC_VERSION }}-vs2022-x64-v2

      - name: Download libuv source
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          Invoke-WebRequest -Uri "https://dist.libuv.org/dist/v${env:UV_VERSION}/libuv-v${env:UV_VERSION}.tar.gz" -OutFile libuv.tar.gz
          tar -xzf libuv.tar.gz
          Move-Item "libuv-v${env:UV_VERSION}" libuv

      - name: Download OpenSSL source
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          # Use the official release tarball: it extracts to a stable openssl-<ver>/
          # dir and includes the Configure script.
          Invoke-WebRequest -Uri "https://github.com/openssl/openssl/releases/download/openssl-${env:OPENSSL_VERSION}/openssl-${env:OPENSSL_VERSION}.tar.gz" -OutFile openssl.tar.gz
          tar -xzf openssl.tar.gz
          Move-Item "openssl-${env:OPENSSL_VERSION}" openssl

      - name: Download hwloc source
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          # v6.27.0 dropped the bundled hwloc; supply it through XMRIG_DEPS instead.
          # hwloc >= 2.15 ships a CMake build for Windows in contrib/windows-cmake.
          $series = ($env:HWLOC_VERSION -split '\.')[0..1] -join '.'
          Invoke-WebRequest -Uri "https://download.open-mpi.org/release/hwloc/v${series}/hwloc-${env:HWLOC_VERSION}.tar.gz" -OutFile hwloc.tar.gz
          tar -xzf hwloc.tar.gz
          Move-Item "hwloc-${env:HWLOC_VERSION}" hwloc

      - name: Build libuv (static, Release x64)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          # libuv release tarballs ship CMake only (no MSBuild .vcxproj), so build it
          # with CMake using the Visual Studio generator, matching libuv's own CI.
          # xmrig's Release flags use /MT (static CRT), so libuv must match or the
          # final link will fail on conflicting default libs.
          cmake -S libuv -B libuv/build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release -DLIBUV_BUILD_SHARED=OFF -DBUILD_TESTING=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build libuv/build --config Release -- /m
          New-Item -ItemType Directory -Force -Path deps/include, deps/lib | Out-Null
          Copy-Item -Recurse -Force libuv/include/* deps/include/
          # On Windows the static target is prefixed: libuv.lib (not uv.lib).
          $lib = Get-ChildItem -Recurse -Filter "libuv.lib" -Path libuv/build/Release | Select-Object -First 1
          if (-not $lib) { throw "libuv static library not found after build" }
          Write-Host "Using libuv lib: $($lib.FullName)"
          Copy-Item -Force $lib.FullName deps/lib/libuv.lib

      - name: Build OpenSSL (static, /MT, Release x64)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          # The GitHub Windows runner ships Perl but no NASM, so disable assembly.
          # /MT matches xmrig's static Release CRT; no-shared + no-pinshared yield
          # plain static libs (libcrypto.lib / libssl.lib) with no DllMain .pdb.
          # Ensure a Perl suitable for Configure. Strawberry Perl ships on the
          # windows-2022 runner; install it if the image ever drops it.
          if (Test-Path "C:\Strawberry\perl\bin") { $env:Path = "C:\Strawberry\perl\bin;$env:Path" }
          if (-not (Get-Command perl -ErrorAction SilentlyContinue)) {
            choco install strawberryperl -y --no-progress
            $env:Path = "C:\Strawberry\perl\bin;$env:Path"
          }
          Push-Location openssl
          perl Configure VC-WIN64A no-shared no-pinshared no-asm no-tests `
            --prefix="${{ github.workspace }}/deps" --libdir=lib
          if ($LASTEXITCODE -ne 0) { throw "OpenSSL Configure failed" }
          nmake
          if ($LASTEXITCODE -ne 0) { throw "OpenSSL build failed" }
          nmake install_sw
          if ($LASTEXITCODE -ne 0) { throw "OpenSSL install failed" }
          Pop-Location
          $lib = Get-ChildItem -Filter "libcrypto.lib" -Path deps/lib | Select-Object -First 1
          if (-not $lib) { throw "OpenSSL static library not found after build" }
          Write-Host "Using OpenSSL lib: $($lib.FullName)"

      - name: Build hwloc (static, /MT, Release x64)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          # /MT matches xmrig's static Release CRT, as for libuv and OpenSSL above.
          cmake -S hwloc/contrib/windows-cmake -B hwloc/build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deps" `
            -DCMAKE_INSTALL_LIBDIR=lib `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DBUILD_SHARED_LIBS=OFF `
            -DHWLOC_ENABLE_TESTING=OFF `
            -DHWLOC_SKIP_TOOLS=ON `
            -DHWLOC_SKIP_LSTOPO=ON
          cmake --build hwloc/build --config Release --target install -- /m
          $lib = Get-ChildItem -Filter "hwloc.lib" -Path deps/lib | Select-Object -First 1
          if (-not $lib) { throw "hwloc static library not found after build" }
          Write-Host "Using hwloc lib: $($lib.FullName)"

      - name: Configure (Visual Studio 2022, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_STATIC=ON -DXMRIG_DEPS="${{ github.workspace }}/deps"

      - name: Build
        run: cmake --build build --config Release --target xmrig -- /m

      - name: Package zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          $stage = "package"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Force build/Release/xmrig.exe $stage/
          Get-ChildItem build/Release/*.dll, build/Release/*.sys -ErrorAction SilentlyContinue | Copy-Item -Destination $stage/ -Force
          $zip = "xmrig-${ver}-windows-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          "ASSET=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          token: ${{ secrets.GITHUB_TOKEN }}
